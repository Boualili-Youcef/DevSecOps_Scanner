name: Analyse de sécurité

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Politique de sécurité
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Récupérer le commit de fusion de la PR sans accès IA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Installer les dépendances figées des scanners
        run: python -m pip install -r requirements-scan.txt
      - name: Installer Trivy après vérification de son empreinte
        run: bash scripts/install_trivy.sh
      - name: Tester le traitement des rapports
        run: python -m unittest discover -s tests -v
      - name: Analyser Terraform et l’image Docker
        run: python -m scripts.scan --trivy .tools/trivy
      - name: Publier le résumé de l’analyse
        if: always()
        shell: bash
        run: |
          if test -f reports/summary.md; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Analyse incomplète. Consulter les journaux des scanners ; aucun résultat réussi disponible.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver les rapports avant le contrôle de sécurité
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/checkov.json
            reports/trivy.json
            reports/normalized.json
            reports/summary.md
            reports/manifest.json
          retention-days: 7
          if-no-files-found: warn
      - name: Appliquer la politique des scanners
        if: always()
        run: python -m scripts.normalize --gate
