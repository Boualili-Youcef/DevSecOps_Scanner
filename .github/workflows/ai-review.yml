name: Revue de sécurité IA

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de PR ouverte (changements limités à demo)
        required: true
        type: number

permissions: {}

concurrency:
  group: ai-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gemini-review
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Récupérer le commit de confiance depuis main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Installer les dépendances figées de Gemini
        run: python -m pip install -r requirements.txt
      - name: Tester le code de confiance sans secrets
        run: python -m unittest discover -s tests -v
      - name: Vérifier et télécharger les rapports du commit actuel de la PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.github_comment recuperer --pr "$PR_NUMBER"
      - name: Expliquer les constats prioritaires avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python -m scripts.gemini_review
      - name: Mettre à jour le commentaire de la PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.github_comment publier --pr "$PR_NUMBER"
